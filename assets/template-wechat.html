<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公众号排版 — 标题</title>
<!--
使用方法：
1. 浏览器打开 base64 版
2. Cmd+A 全选 → Cmd+C 复制
3. 粘贴进公众号编辑器（图片自动显示）

公众号标题建议：
- 中文长标题先按语义断句；若需两行，用 <br> 在标点、转折或完整短语边界显式换行
- 英文单词、数字、产品名、专有名词必须整块呈现，禁止拆词或留下单字符独占一行
- 空间不足时优先缩字号或调整标题结构，禁止压缩字距、硬拆英文

排版方案：杂志编号风（超大淡色装饰词 + 衬线标题 + 酪乳黄短条 + 荧光笔高亮）
-->
</head>
<body style="margin:0; padding:0; background:#FFF8DE;">

<section style="max-width:677px; margin:0 auto; background:#FFFEFA; padding:44px 26px 40px; font-family:-apple-system,'PingFang SC','Helvetica Neue',sans-serif; color:#2D2423; font-size:18px; line-height:2;">

  <!-- 顶部 kicker -->
  <section style="text-align:center; margin-bottom:14px;">
    <span style="font-size:13px; font-weight:bold; letter-spacing:5px; color:#506F7D;">KICKER标签</span>
  </section>

  <!-- 大标题（叙事类可选） -->
  <section style="text-align:center; margin-bottom:40px; padding:50px 0 40px;">
    <!-- 长标题只可在语义边界用 <br> 显式断行；英文和数字单元以 nowrap span 包裹 -->
    <p style="margin:0 0 12px; font-family:Georgia,'Songti SC',serif; font-size:32px; font-weight:900; color:#43302E; line-height:1.5; word-break:normal; overflow-wrap:normal;">主标题</p>
    <p style="margin:0 0 24px; font-size:17px; color:#6B5955; line-height:1.8;">副标题</p>
  </section>

  <!-- 引言金句 -->
  <section style="text-align:center; margin-bottom:10px;">
    <p style="margin:0; font-family:Georgia,'Songti SC',serif; font-size:21px; font-weight:900; line-height:1.9;">金句第一行<br>金句第二行<span style="color:#43302E;">旧勃艮第棕关键词</span>。</p>
  </section>

  <!-- 三主色装饰条：沿用原作者的长度与节奏 -->
  <section style="text-align:center; margin-bottom:36px;">
    <span style="display:inline-block; width:36px; height:4px; background:#43302E; border-radius:2px;"></span>
    <span style="display:inline-block; width:18px; height:4px; background:#FFF1B5; border-radius:2px; margin-left:5px;"></span>
    <span style="display:inline-block; width:8px; height:4px; background:#C1DBE8; border-radius:2px; margin-left:5px;"></span>
  </section>

  <!-- 引言区块（奶油米黄浅底） -->
  <section style="margin-bottom:36px; padding:24px 22px; background:#FFF8DE; border-radius:16px;">
    <p style="margin:0 0 14px; font-size:16px; line-height:2; color:#2D2423;">引言正文第一段。</p>
    <p style="margin:0; font-size:16px; line-height:2; color:#2D2423;">引言正文第二段。</p>
  </section>

  <!-- ===== 章节示例（叙事类三件套） ===== -->
  <section style="margin-bottom:52px;">
    <section style="margin-bottom:6px; overflow:visible;">
      <span style="display:inline-block; font-family:Georgia,'Songti SC',serif; font-style:italic; font-size:68px; font-weight:bold; color:rgba(67,48,46,0.14); line-height:1; white-space:nowrap; word-break:keep-all; overflow-wrap:normal;">Word</span>
    </section>
    <section style="margin-bottom:10px;">
      <span style="font-family:Georgia,'Songti SC',serif; font-size:27px; font-weight:900;">章节标题</span>
    </section>
    <section style="margin-bottom:22px;">
      <span style="display:inline-block; width:56px; height:6px; background:#FFF1B5; border-radius:3px;"></span>
    </section>

    <!-- 图片 -->
    <section style="width:100%; height:200px; border-radius:14px; margin-bottom:20px; background:#FFF8DE; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden;">
      <span style="font-family:Georgia,serif; font-size:120px; font-weight:bold; color:rgba(67,48,46,.08); position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);">IMG</span><span style="font-size:13px; color:#506F7D; position:relative; z-index:1;">配图位置</span>
    </section>

    <!-- 正文 -->
    <p style="margin:0 0 18px; font-size:18px; line-height:2; color:#2D2423;">正文段落。其中<span style="background:linear-gradient(transparent 60%, #FFF1B5 60%); font-weight:bold; padding:0 2px;">荧光笔高亮文字</span>用于重点句。</p>
    <p style="margin:0 0 18px; font-size:18px; line-height:2; color:#2D2423;">第二段正文。</p>
  </section>

  <!-- 三主色分隔条（章节间） -->
  <section style="text-align:center; margin-bottom:56px;">
    <span style="display:inline-block; width:36px; height:4px; background:#43302E; border-radius:2px;"></span>
    <span style="display:inline-block; width:18px; height:4px; background:#FFF1B5; border-radius:2px; margin-left:5px;"></span>
    <span style="display:inline-block; width:8px; height:4px; background:#C1DBE8; border-radius:2px; margin-left:5px;"></span>
  </section>

  <!-- ===== 更多章节... ===== -->

  <!-- 结尾金句 -->
  <section style="text-align:center; margin:48px 0 36px;">
    <span style="font-family:Georgia,'Songti SC',serif; font-style:italic; font-size:56px; color:rgba(67,48,46,.18); line-height:1;">"</span>
    <p style="margin:8px 0 6px; font-family:Georgia,'Songti SC',serif; font-size:21px; font-weight:900; line-height:1.8;">核心金句</p>
    <p style="margin:0 0 16px; font-size:14px; color:#9A837D;">副句补充</p>
  </section>

  <!-- 签名档 -->
  <section style="text-align:center; padding:20px 0 0;">
    <img src="avatar.png" alt="栗栗安头像" style="width:48px; height:48px; object-fit:cover; border:2px solid #C1DBE8; padding:2px; background:#FFFEFA; border-radius:50%; margin-bottom:10px;">
    <p style="margin:0 0 4px; font-size:15px; font-weight:bold; color:#43302E;">栗栗安</p>
    <p style="margin:0; font-size:13px; color:#6B5955; line-height:1.8;">AI 自媒体 × 女性成长<br>温暖地学习，清醒地成长</p>
  </section>

</section>

<!-- © ESTHER不二 esthersjw/esther-design-system CC BY-NC 4.0 -->
<section style="position:absolute;left:-9999px;font-size:0;line-height:0;opacity:0;height:0;overflow:hidden;">esthersjw-design-system</section>
</body>
</html>
