<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>栗栗安 · 完整视觉验收台</title>
  <style>
    :root {
      --burgundy: #43302E;
      --buttermilk: #FFF1B5;
      --mist-blue: #C1DBE8;
      --auxiliary-cream: #FFF8DE;
      --paper: #FFFEFA;
      --ink-soft: #6B5955;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      overflow: hidden;
      color: var(--burgundy);
      background: var(--buttermilk);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .shell {
      display: grid;
      grid-template-columns: 278px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      padding: 28px 22px 22px;
      background: var(--buttermilk);
      border-right: 1px solid rgba(67,48,46,.18);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 0 6px 22px;
      border-bottom: 1px solid rgba(67,48,46,.16);
    }

    .brand img {
      width: 48px;
      height: 48px;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid var(--mist-blue);
      background: var(--paper);
    }

    .brand-name {
      font-family: Georgia, "Songti SC", serif;
      font-size: 1.18rem;
      font-weight: 700;
    }

    .brand-note {
      margin-top: 3px;
      color: var(--ink-soft);
      font-size: .72rem;
      letter-spacing: .04em;
    }

    .nav-label {
      padding: 22px 8px 10px;
      color: var(--ink-soft);
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .nav-list {
      display: grid;
      gap: 6px;
      overflow-y: auto;
    }

    .nav-item {
      width: 100%;
      display: grid;
      grid-template-columns: 30px 1fr;
      align-items: center;
      gap: 8px;
      padding: 11px 12px;
      border: 1px solid transparent;
      border-radius: 10px;
      color: var(--burgundy);
      background: transparent;
      text-align: left;
      cursor: pointer;
      transition: background .18s ease, color .18s ease, border-color .18s ease;
    }

    .nav-item:hover {
      border-color: rgba(67,48,46,.22);
      background: var(--auxiliary-cream);
    }

    .nav-item.active {
      color: var(--auxiliary-cream);
      background: var(--burgundy);
    }

    .nav-index {
      font-family: Georgia, serif;
      font-size: .72rem;
      opacity: .65;
    }

    .nav-title {
      font-size: .87rem;
      font-weight: 650;
    }

    .palette {
      margin-top: auto;
      padding: 20px 6px 2px;
    }

    .palette-bar {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      width: 176px;
      height: 10px;
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid rgba(67,48,46,.2);
      border-radius: 999px;
    }

    .palette-bar i {
      display: block;
      height: 100%;
    }

    .palette-bar i:nth-child(1) { background: var(--buttermilk); }
    .palette-bar i:nth-child(2) { background: var(--burgundy); }
    .palette-bar i:nth-child(3) { background: var(--mist-blue); }
    .palette-bar i:nth-child(4) { background: var(--auxiliary-cream); }

    .viewer {
      min-width: 0;
      display: grid;
      grid-template-rows: 64px minmax(0, 1fr);
      background: var(--mist-blue);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 0 22px;
      background: var(--paper);
      border-bottom: 1px solid rgba(67,48,46,.12);
    }

    .current-kicker {
      color: var(--ink-soft);
      font-size: .65rem;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .current-title {
      margin-top: 2px;
      font-family: Georgia, "Songti SC", serif;
      font-size: 1.04rem;
      font-weight: 700;
    }

    .toolbar-actions { display: flex; gap: 8px; }

    .action {
      padding: 8px 13px;
      border: 1px solid rgba(67,48,46,.24);
      border-radius: 8px;
      color: var(--burgundy);
      background: var(--auxiliary-cream);
      font-size: .76rem;
      font-weight: 650;
      text-decoration: none;
      cursor: pointer;
    }

    .action.primary {
      color: var(--auxiliary-cream);
      border-color: var(--burgundy);
      background: var(--burgundy);
    }

    .frame-wrap { min-height: 0; padding: 14px; }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 12px;
      background: var(--paper);
      box-shadow: 0 12px 34px rgba(67,48,46,.16);
    }

    @media (max-width: 820px) {
      body { overflow: auto; }
      .shell { grid-template-columns: 1fr; }
      .sidebar { border-right: 0; border-bottom: 1px solid rgba(67,48,46,.18); }
      .nav-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .palette { display: none; }
      .viewer { min-height: 82vh; }
      .toolbar { padding: 10px 14px; }
      .action:not(.primary) { display: none; }
      .frame-wrap { min-height: 72vh; padding: 8px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <aside class="sidebar">
      <div class="brand">
        <img src="assets/avatar.png" alt="栗栗安头像">
        <div>
          <div class="brand-name">栗栗安</div>
          <div class="brand-note">温暖 · 知性 · 高级</div>
        </div>
      </div>

      <div class="nav-label">完整视觉场景</div>
      <nav class="nav-list" id="navList" aria-label="视觉场景切换"></nav>

      <div class="palette">
        <div class="palette-bar" aria-label="酪乳黄50%，旧勃艮第棕25%，柔雾蓝15%，奶油米黄10%"><i></i><i></i><i></i><i></i></div>
      </div>
    </aside>

    <section class="viewer">
      <header class="toolbar">
        <div>
          <div class="current-kicker">Visual Review</div>
          <div class="current-title" id="currentTitle">个人品牌总览</div>
        </div>
        <div class="toolbar-actions">
          <button class="action" id="refreshButton" type="button">刷新当前页</button>
          <a class="action primary" id="openButton" href="demo-lilian-brand.html" target="_blank">独立打开</a>
        </div>
      </header>
      <div class="frame-wrap">
        <iframe id="previewFrame" src="demo-lilian-brand.html" title="栗栗安完整视觉预览"></iframe>
      </div>
    </section>
  </main>

  <script>
    const scenes = [
      { title: '个人品牌总览', file: 'demo-lilian-brand.html' },
      { title: '教程与品牌基因', file: 'demo-readme-tutorial.html' },
      { title: '活动 Landing Page', file: 'demo-landing.html' },
      { title: 'App 工作台', file: 'demo-app.html' },
      { title: '小红书图文卡片', file: 'demo-cards.html' },
      { title: '16 种布局组合', file: 'demo-layouts.html' },
      { title: '51 种组件视觉', file: 'components-preview.html' },
      { title: '公众号排版', file: 'assets/demo-wechat.html' }
    ];

    const navList = document.getElementById('navList');
    const frame = document.getElementById('previewFrame');
    const currentTitle = document.getElementById('currentTitle');
    const openButton = document.getElementById('openButton');

    function selectScene(index) {
      const scene = scenes[index];
      frame.src = scene.file;
      currentTitle.textContent = scene.title;
      openButton.href = scene.file;
      document.querySelectorAll('.nav-item').forEach((button, buttonIndex) => {
        button.classList.toggle('active', buttonIndex === index);
      });
    }

    scenes.forEach((scene, index) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = `nav-item${index === 0 ? ' active' : ''}`;
      button.innerHTML = `<span class="nav-index">${String(index + 1).padStart(2, '0')}</span><span class="nav-title">${scene.title}</span>`;
      button.addEventListener('click', () => selectScene(index));
      navList.appendChild(button);
    });

    document.getElementById('refreshButton').addEventListener('click', () => {
      frame.src = frame.src;
    });
  </script>
</body>
</html>
